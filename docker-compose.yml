version: '3.9'

services:
  # ==========================================================================
  # TheMemeCanvas Automation Suite
  # ==========================================================================
  thememecanvas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thememecanvas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # All other settings from .env file
    env_file:
      - .env
    volumes:
      # Persist database, logs, and credentials outside the container
      - ./data:/app/data
      - ./logs:/app/logs
      - ./credentials:/app/credentials
      - ./assets:/app/assets
      # Mount temp directories (cleared on restart)
      - thememecanvas_temp:/app/temp_downloads
      - thememecanvas_thumbs:/app/temp_thumbnails
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.thememecanvas.service=automation-suite"
      - "com.thememecanvas.version=1.0.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# ==============================================================================
# Named Volumes
# ==============================================================================
volumes:
  thememecanvas_temp:
    driver: local
  thememecanvas_thumbs:
    driver: local
